name: Hotfix KodeOTP 500 (No Rebuild)

on:
  workflow_dispatch:

concurrency:
  group: kodeotp-hotfix-500-production
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fix Laravel runtime and Vite manifest without rebuild
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd /opt/kodeotp/app
            git fetch --prune origin
            git reset --hard origin/master
            chmod +x deploy/kodeotp-hotfix-500.sh
            bash deploy/kodeotp-hotfix-500.sh