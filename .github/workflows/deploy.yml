name: Deploy dapetOTP ke VPS

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/**'
      - 'compose.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dapetotp-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync, build, dan restart
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Pastikan tool deploy tersedia
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v sshpass >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y sshpass rsync
          fi

      - name: Siapkan SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?VPS_HOST belum diisi}"
          : "${VPS_USER:?VPS_USER belum diisi}"
          : "${VPS_PASSWORD:?VPS_PASSWORD belum diisi}"

          VPS_PORT="${VPS_PORT:-22}"
          echo "VPS_PORT=$VPS_PORT" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Cek VPS sekali
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=12 \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/dapetotp/app &&
             command -v docker >/dev/null &&
             docker compose version >/dev/null &&
             command -v rsync >/dev/null &&
             echo "VPS siap"'

      - name: Sinkronkan hanya file yang berubah
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          sshpass -e rsync -az --checksum --delete-delay \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='production.env' \
            --exclude='node_modules/' \
            --exclude='build/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='dapetotp_deploy' \
            --exclude='dapetotp_deploy.pub' \
            -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=12" \
            ./ "$VPS_USER@$VPS_HOST:/opt/dapetotp/app/"

      - name: Build cerdas dan deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=12 \
            "$VPS_USER@$VPS_HOST" \
            'APP_DIR=/opt/dapetotp/app \
             ENV_FILE=/opt/dapetotp/production.env \
             STATE_DIR=/opt/dapetotp/.deploy-state \
             bash /opt/dapetotp/app/deploy/deploy.sh'
