name: Deploy dapetOTP ke VPS

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/**'
      - 'compose.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dapetotp-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync, build, dan restart
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pasang rsync
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rsync

      - name: Siapkan SSH key
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?VPS_HOST belum diisi}"
          : "${VPS_USER:?VPS_USER belum diisi}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY belum diisi}"
          : "${VPS_KNOWN_HOSTS:?VPS_KNOWN_HOSTS belum diisi}"

          VPS_PORT="${VPS_PORT:-22}"
          echo "VPS_PORT=$VPS_PORT" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/dapetotp_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/dapetotp_deploy" "$HOME/.ssh/known_hosts"

      - name: Cek VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/dapetotp_deploy" \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=12 \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/dapetotp/app &&
             command -v docker >/dev/null &&
             docker compose version >/dev/null &&
             command -v rsync >/dev/null &&
             echo "VPS siap"'

      - name: Sinkronkan source ke VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          rsync -az --checksum --delete-delay \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='production.env' \
            --exclude='node_modules/' \
            --exclude='build/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "ssh -i $HOME/.ssh/dapetotp_deploy -p $VPS_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=12" \
            ./ "$VPS_USER@$VPS_HOST:/opt/dapetotp/app/"

      - name: Build dan deploy
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/dapetotp_deploy" \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=12 \
            "$VPS_USER@$VPS_HOST" \
            'APP_DIR=/opt/dapetotp/app \
             ENV_FILE=/opt/dapetotp/production.env \
             STATE_DIR=/opt/dapetotp/.deploy-state \
             bash /opt/dapetotp/app/deploy/deploy.sh'
