name: Deploy dapetOTP ke VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dapetotp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync, build, dan restart
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install SSH password client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Siapkan SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?VPS_HOST belum diisi}"
          : "${VPS_USER:?VPS_USER belum diisi}"
          : "${VPS_PORT:?VPS_PORT belum diisi}"
          : "${VPS_PASSWORD:?VPS_PASSWORD belum diisi}"

          echo "VPS_PORT=$VPS_PORT" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          ssh-keyscan \
            -p "$VPS_PORT" \
            -H "$VPS_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Tes koneksi VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'echo "SSH VPS BERHASIL"'

      - name: Pastikan kebutuhan deploy tersedia
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/dapetotp/app &&
             command -v docker >/dev/null &&
             docker compose version >/dev/null &&
             command -v rsync >/dev/null'

      - name: Sinkronkan source GitHub ke VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          sshpass -e rsync -az --delete-delay \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='production.env' \
            --exclude='node_modules/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='dapetotp_deploy' \
            --exclude='dapetotp_deploy.pub' \
            -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:/opt/dapetotp/app/"

      - name: Build dan deploy di VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'APP_DIR=/opt/dapetotp/app \
             ENV_FILE=/opt/dapetotp/production.env \
             STATE_DIR=/opt/dapetotp/.deploy-state \
             bash /opt/dapetotp/app/deploy/deploy.sh'