name: Fix KodeOTP Integrations (No Rebuild)

on:
  workflow_dispatch:

concurrency:
  group: kodeotp-integration-v8-production
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Patch runtime, sync catalog, and fix SMTP test
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /opt/kodeotp/app
            git fetch --prune origin
            git reset --hard origin/master
            chmod +x deploy/kodeotp-integration-v8.sh
            bash deploy/kodeotp-integration-v8.sh
