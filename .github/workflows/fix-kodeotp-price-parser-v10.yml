name: Fix KodeOTP Price Parser V10 (No Rebuild)

on:
  workflow_dispatch:

concurrency:
  group: kodeotp-price-parser-v10-production
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Parse nested SMS Virtual prices without rebuild
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 32m
          script: |
            set -euo pipefail
            cd /opt/kodeotp/app
            git fetch --prune origin
            git reset --hard origin/master
            chmod +x deploy/kodeotp-price-parser-v10.sh
            bash deploy/kodeotp-price-parser-v10.sh
