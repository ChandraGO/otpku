name: Resume KodeOTP (No Rebuild)

on:
  workflow_dispatch:

concurrency:
  group: kodeotp-resume-production
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_EMAIL: ${{ secrets.OTPKU_ADMIN_EMAIL }}
      ADMIN_WHATSAPP: ${{ secrets.OTPKU_ADMIN_WHATSAPP }}
      ADMIN_PASSWORD: ${{ secrets.OTPKU_ADMIN_PASSWORD }}

    steps:
      - name: Resume existing installation without rebuild
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 18m
          envs: ADMIN_EMAIL,ADMIN_WHATSAPP,ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/kodeotp/app
            git fetch --prune origin
            git reset --hard origin/master
            chmod +x deploy/kodeotp-resume.sh
            bash deploy/kodeotp-resume.sh