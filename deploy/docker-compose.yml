name: kodeotp

x-runtime-volumes: &runtime-volumes
  - "${KODEOTP_RELEASE_DIR:?KODEOTP_RELEASE_DIR wajib diisi}/app:/var/www/html/app:ro"
  - "${KODEOTP_RELEASE_DIR:?KODEOTP_RELEASE_DIR wajib diisi}/bootstrap/app.php:/var/www/html/bootstrap/app.php:ro"
  - "${KODEOTP_RELEASE_DIR:?KODEOTP_RELEASE_DIR wajib diisi}/bootstrap/providers.php:/var/www/html/bootstrap/providers.php:ro"
  - "${KODEOTP_RELEASE_DIR:?KODEOTP_RELEASE_DIR wajib diisi}/config:/var/www/html/config:ro"
  - "${KODEOTP_RELEASE_DIR:?KODEOTP_RELEASE_DIR wajib diisi}/database:/var/www/html/database:ro"
  - "${KODEOTP_RELEASE_DIR:?KODEOTP_RELEASE_DIR wajib diisi}/public:/var/www/html/public:ro"
  - "${KODEOTP_RELEASE_DIR:?KODEOTP_RELEASE_DIR wajib diisi}/resources:/var/www/html/resources:ro"
  - "${KODEOTP_RELEASE_DIR:?KODEOTP_RELEASE_DIR wajib diisi}/routes:/var/www/html/routes:ro"
  - app_backups:/var/www/html/storage/app/backups
  # Upload publik harus hidup di luar writable layer container agar tidak hilang
  # saat blue/green switch, force-recreate, atau deploy berikutnya.
  - ./shared/public:/var/www/html/storage/app/public
  # Jalur yang sama dipasang langsung ke public/storage agar Nginx tidak
  # bergantung pada symlink public/storage dari release. Mount kedua read-only:
  # aplikasi menulis lewat storage/app/public, web hanya membaca dari sini.
  - ./shared/public:/var/www/html/public/storage:ro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-kodeotp}"
      POSTGRES_USER: "${POSTGRES_USER:-kodeotp_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kodeotp_app} -d ${POSTGRES_DB:-kodeotp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${KODEOTP_GATEWAY_HOST:-127.0.0.1}:${KODEOTP_GATEWAY_PORT:-3280}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/snippets
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]

  app_blue: &app
    image: "${KODEOTP_IMAGE:-kodeotp-app:latest}"
    restart: unless-stopped
    env_file: [./app.env]
    expose: ["8080"]
    volumes: *runtime-volumes
    networks: [frontend, backend]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz | grep -q '\"service\":\"kodeotp\"'"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  app_green:
    <<: *app

  worker:
    image: "${KODEOTP_IMAGE:-kodeotp-app:latest}"
    restart: unless-stopped
    env_file: [./app.env]
    command: ["php", "artisan", "queue:work", "redis", "--sleep=2", "--tries=3", "--timeout=1000", "--max-time=3600"]
    stop_grace_period: 35s
    volumes: *runtime-volumes
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  scheduler:
    image: "${KODEOTP_IMAGE:-kodeotp-app:latest}"
    restart: unless-stopped
    env_file: [./app.env]
    command: ["php", "artisan", "schedule:work"]
    volumes: *runtime-volumes
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

networks:
  frontend:
  backend:

volumes:
  postgres_data:
  redis_data:
  app_backups:
  caddy_data:
  caddy_config:
